<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>YouTube Live Timestamp</title>
    <style>
      body { font: 13px/1.5 system-ui, sans-serif; margin: 0; min-width: 320px; max-width: 420px; }
      header { padding: 8px 12px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
      ul { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; }
      li { padding: 6px 12px; border-bottom: 1px solid #eee; display: flex; gap: 8px; align-items: baseline; }
      li a { font-variant-numeric: tabular-nums; font-weight: 600; }
      li small { color: #666; }
      .empty { padding: 16px 12px; color: #666; }
      button { font: inherit; }
    </style>
  </head>
  <body>
    <header>
      <strong>記録一覧</strong>
      <span><span id="count">0</span> 件 <button id="clear">全削除</button></span>
    </header>
    <ul id="list"></ul>
    <p class="empty" id="empty">まだ記録がありません。YouTube のライブ配信で Alt+Shift+T を押してください。</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
